name: Release
run-name: Release (${{ inputs.bump }})

# Cuts the next vX.Y.Z from master, creates the GitHub Release and moves the major
# tag (ccswe-apps/actions release-tag.yml; README "Releasing").

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump
        type: choice
        options: [patch, minor, major]
        required: true

permissions:
  contents: read
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: ccswe-apps/actions/.github/workflows/release-tag.yml@v1
    with:
      bump: ${{ inputs.bump }}
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
